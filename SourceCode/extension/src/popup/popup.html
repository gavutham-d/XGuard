<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XGuard</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand-left">
        <div class="shield-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 6V12C3 17.5 7 21.5 12 22C17 21.5 21 17.5 21 12V6L12 2Z" fill="#0284C7" stroke="#00F2FE" stroke-width="1.5"/>
            <path d="M9 12L11 14L15 10" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-title">XGuard</span>
      </div>

      <div class="status-pill" id="protectionStatusPill">
        <span class="dot"></span>
        <span id="protectionStatusText">Active</span>
      </div>
    </header>

    <!-- Active Webpage Card -->
    <div class="active-site-card">
      <div class="site-card-top">
        <span class="card-label">CURRENT ACTIVE TAB</span>
        <span class="badge" id="popupRiskBadge">EVALUATING</span>
      </div>
      <div class="site-domain" id="popupSiteDomain">Loading...</div>
      <div class="site-score-row">
        <span>Risk Score:</span>
        <strong id="popupRiskScore">--/100</strong>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-num" id="popupTotalScans">0</span>
        <span class="stat-lbl">Scans Today</span>
      </div>
      <div class="stat-box">
        <span class="stat-num danger" id="popupThreatsBlocked">0</span>
        <span class="stat-lbl">Threats Blocked</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-stack">
      <button class="btn btn-primary" id="btnOpenSidePanel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        Open Full Security Sidebar
      </button>

      <button class="btn btn-secondary" id="btnRescanPopup">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Re-Scan Active Page
      </button>
    </div>

    <footer class="popup-footer">
      <span>Mode: <strong id="popupActiveMode">Balanced</strong></span>
      <a href="#" id="linkOpenSettings">Settings</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
